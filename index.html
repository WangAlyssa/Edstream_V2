<!doctype html>
<html lang="en">
  <head>
    <script>
      (function (l) {
        if (l.search.length > 1) {
          var q = l.search.slice(1).split("&");
          var p = q.find(function (s) { return s.startsWith("p=/"); });
          if (p) {
            var path = p.slice(2).replace(/~and~/g, "&");
            var rest = q.filter(function (s) { return !s.startsWith("p=/"); });
            var search = rest.length ? "?" + rest.join("&").replace(/~and~/g, "&") : "";
            l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + l.pathname + path + search + l.hash);
          }
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="EdStream is an integrated Canvas LMS communication and academic collaboration platform."
    />
    <title>EdStream</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
