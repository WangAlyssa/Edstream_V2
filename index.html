    <script>
      (function (l) {
        if (l.search.length > 1) {
          var q = l.search.slice(1).split("&");
          var p = q.find(function (s) { return s.startsWith("p=/"); });
          if (p) {
            var path = p.slice(2).replace(/~and~/g, "&");
            var rest = q.filter(function (s) { return !s.startsWith("p=/"); });
            var search = rest.length ? "?" + rest.join("&").replace(/~and~/g, "&") : "";
            l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + l.pathname + path + search + l.hash);
          }
        }
      })(window.location);
    </script>
